<title>NYABUNGO — Menu digital • Hôtel Restaurant</title>
<script>
(function(){
  var de=document.documentElement;
  function get(k,ls){ try{ var v=(ls?localStorage:sessionStorage).getItem('nya.'+k); return v===null?null:JSON.parse(v);}catch(e){return null;} }
  var t=get('theme',true);
  if(!t){ t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'; }
  de.setAttribute('data-theme',t);
  var l=get('lang',true);
  de.lang=(l==='en')?'en':'fr';
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='light'?'#f4ecdf':'#0f0a06');
})();
</script>
